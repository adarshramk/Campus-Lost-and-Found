{% extends "base.html" %}
{% block title %}Login · Campus Lost & Found{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to report and manage items.</p>
    <form method="post">
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button class="btn full" type="submit">Login</button>
    </form>
    <p class="form-footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
